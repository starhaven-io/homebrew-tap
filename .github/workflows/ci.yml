name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      casks:
        description: Cask tokens to check, separated by spaces or commas. Defaults to all casks.
        required: false
        default: ""
        type: string
      install:
        description: Install and uninstall selected casks after fetch and audit.
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  links:
    name: Links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      args: "--config lychee.toml README.md"
      build-site: false
      site-directory: ""
      authenticated-github: true

  pinprick:
    name: Workflow supply-chain audit
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      advanced-security: false
      fail-on-findings: true

  zizmor:
    name: Workflow security audit
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      advanced-security: false

  syntax:
    name: Syntax
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      casks: ${{ steps.casks.outputs.casks }}
      install: ${{ steps.casks.outputs.install }}
      matrix: ${{ steps.casks.outputs.matrix }}
      run_casks: ${{ steps.casks.outputs.run_casks }}
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          core: true
          cask: true
          stable: true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify active tap checkout
        id: tap
        run: |
          resolved_tap="$(bash scripts/verify_tap_worktree.sh "${GITHUB_WORKSPACE}" "${GITHUB_REPOSITORY}")"
          echo "name=${resolved_tap}" >> "${GITHUB_OUTPUT}"

      - name: Install workflow linters
        run: brew install actionlint shellcheck

      - name: Test repository automation
        run: |
          ruby -e 'Dir["test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
          brew style scripts test
          actionlint
          shellcheck scripts/*.sh

      - name: Resolve cask list
        id: casks
        env:
          INPUT_CASKS: ${{ inputs.casks }}
          INPUT_INSTALL: ${{ inputs.install }}
        run: |
          tokens=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_CASKS//[[:space:],]/}" ]]; then
            normalized="${INPUT_CASKS//,/ }"
            read -r -a tokens <<< "${normalized}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            if ! git rev-parse --verify --quiet "${base_ref}" >/dev/null; then
              git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            fi
            cask_paths="${RUNNER_TEMP}/changed-casks.txt"
            if ! git diff --name-only --diff-filter=ACMR "${base_ref}...HEAD" -- "Casks/*.rb" > "${cask_paths}"; then
              echo "::error::Could not enumerate changed casks"
              exit 1
            fi
            while IFS= read -r path; do
              token="${path#Casks/}"
              tokens+=("${token%.rb}")
            done < "${cask_paths}"
          else
            # bash 3.2 on the macOS runner has no mapfile; read into the array.
            cask_paths="${RUNNER_TEMP}/all-casks.txt"
            if ! find Casks -maxdepth 1 -type f -name "*.rb" -exec basename {} .rb \; | sort > "${cask_paths}"; then
              echo "::error::Could not enumerate repository casks"
              exit 1
            fi
            while IFS= read -r token; do
              tokens+=("${token}")
            done < "${cask_paths}"
          fi
          if [[ "${#tokens[@]}" -gt 0 ]]; then
            deduped=()
            deduped_paths="${RUNNER_TEMP}/deduped-casks.txt"
            if ! printf "%s\n" "${tokens[@]}" | sort -u > "${deduped_paths}"; then
              echo "::error::Could not normalize selected casks"
              exit 1
            fi
            while IFS= read -r token; do
              deduped+=("${token}")
            done < "${deduped_paths}"
            tokens=("${deduped[@]}")
          fi

          if [[ "${#tokens[@]}" -eq 0 && "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "::error::No casks selected"
            exit 1
          fi

          if [[ "${#tokens[@]}" -eq 0 ]]; then
            {
              echo "casks=[]"
              echo 'matrix={"include":[]}'
              echo "run_casks=false"
              echo "install=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          run_casks=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            run_casks=false
          fi

          {
            printf "casks="
            printf "%s\n" "${tokens[@]}" | jq -R . | jq -s -c .
          } >> "${GITHUB_OUTPUT}"

          matrix_json="$(ruby scripts/cask_matrix.rb "${tokens[@]}")"
          echo "matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"
          echo "run_casks=${run_casks}" >> "${GITHUB_OUTPUT}"

          install=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_INSTALL}" == "true" ]]; then
            install=true
          fi
          echo "install=${install}" >> "${GITHUB_OUTPUT}"

      - name: Verify tap syntax
        env:
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: brew test-bot --tap "${TAP_NAME}" --only-tap-syntax

  cask:
    name: ${{ matrix.cask }} (${{ matrix.runner }})
    needs: syntax
    if: ${{ needs.syntax.outputs.run_casks == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.syntax.outputs.matrix) }}
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          core: true
          cask: true
          stable: true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify active tap checkout
        id: tap
        run: |
          resolved_tap="$(bash scripts/verify_tap_worktree.sh "${GITHUB_WORKSPACE}" "${GITHUB_REPOSITORY}")"
          echo "name=${resolved_tap}" >> "${GITHUB_OUTPUT}"

      - name: Fetch cask
        env:
          CASK: ${{ matrix.cask }}
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: brew fetch --cask --retry --force "${TAP_NAME}/${CASK}"
        timeout-minutes: 30

      - name: Audit cask
        env:
          CASK: ${{ matrix.cask }}
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: brew audit --cask --online --strict "${TAP_NAME}/${CASK}"
        timeout-minutes: 30

      - name: Install cask
        id: install
        if: needs.syntax.outputs.install == 'true'
        env:
          CASK: ${{ matrix.cask }}
          TAP_NAME: ${{ steps.tap.outputs.name }}
        run: brew install --cask "${TAP_NAME}/${CASK}"
        timeout-minutes: 30

      - name: Uninstall cask
        if: always() && needs.syntax.outputs.install == 'true' && steps.install.outcome == 'success'
        env:
          CASK: ${{ matrix.cask }}
        run: brew uninstall --cask --force --zap "${CASK}"
        timeout-minutes: 30

  conclusion:
    name: conclusion
    needs:
      - links
      - pinprick
      - syntax
      - cask
      - zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          CASK_RESULT: ${{ needs.cask.result }}
          LINKS_RESULT: ${{ needs.links.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
          RUN_CASKS: ${{ needs.syntax.outputs.run_casks }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          test "${LINKS_RESULT}" = "success"
          test "${PINPRICK_RESULT}" = "success"
          test "${SYNTAX_RESULT}" = "success"
          test "${ZIZMOR_RESULT}" = "success"
          if [[ "${RUN_CASKS}" == "true" ]]; then
            test "${CASK_RESULT}" = "success"
          fi
